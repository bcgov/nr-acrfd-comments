# Default values for MongoDB StatefulSet
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  # Using official MongoDB image from Docker Hub
  repository: mongo
  tag: '7.0'
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: 'mongodb-app'

# Secret configuration - pre-defined Kubernetes Secret
# The Secret must contain: mongodb-username, mongodb-password, mongodb-database, mongodb-admin-password
secret:
  name: mongodb-secret

# Persistence configuration
persistence:
  # Use existing PVC - this preserves your current data
  enabled: true
  existingClaim: mongodbdata
  mountPath: /data/db
  # If existingClaim is not set, a new PVC will be created
  # storageClassName: ""
  # size: 10Gi
  # accessMode: ReadWriteOnce

# Service configuration
service:
  name: mongodb
  type: ClusterIP
  port: 27017
  # Headless service for StatefulSet - required for DNS
  clusterIP: None

# Resource limits and requests
resources:
  limits:
    cpu: '2'
    memory: 4Gi
  requests:
    cpu: 250m
    memory: 2Gi

# Readiness probe - checks if MongoDB is accepting connections
readinessProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - mongosh --quiet --eval "db.adminCommand('ping')" || exit 1
  initialDelaySeconds: 10
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 6

# Liveness probe - restarts pod if MongoDB stops responding
livenessProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - mongosh --quiet --eval "db.adminCommand('ping')" || exit 1
  initialDelaySeconds: 30
  timeoutSeconds: 10
  periodSeconds: 20
  failureThreshold: 6

# Node selector - optional, allows targeting specific nodes
nodeSelector: {}

# Tolerations - optional, for node taints
tolerations: []

# Affinity rules - optional, for pod scheduling
affinity: {}

# Security context
securityContext: {}

# Pod security policy
podSecurityPolicy:
  enabled: false
  name: ''

# Enable debug logging
debug: false

# Migration configuration - for upgrading from older MongoDB versions
migration:
  # Set to true to enable automatic Feature Compatibility Version (FCV) upgrade
  # Required when upgrading from MongoDB 3.6 to 7.0
  enabled: true
  # Target FCV version to upgrade to (should match the major.minor of MongoDB image)
  targetFCV: '7.0'
