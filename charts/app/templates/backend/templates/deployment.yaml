{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  strategy:
    type: {{ .Values.backend.deploymentStrategy }}
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: '/api/metrics'
      labels:
        {{- include "backend.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for MongoDB to be ready at {{ .Values.mongodb.service.name | default "mongodb" }}:{{ .Values.mongodb.service.port | default 27017 }}..."
              for i in $(seq 1 60); do
                if mongosh --authenticationDatabase=admin -u "$MONGODB_USERNAME" -p "$MONGODB_PASSWORD" mongodb://{{ .Values.mongodb.service.name | default "mongodb" }}:{{ .Values.mongodb.service.port | default 27017 }} --eval "db.adminCommand({ping: 1})" 2>/dev/null | grep -q '{ ok: 1 }'; then
                  echo "✅ MongoDB is ready"
                  exit 0
                fi
                echo "Attempt $i: MongoDB not ready yet, retrying..."
                sleep 5
              done
              echo "❌ MongoDB failed to become ready after 5 minutes"
              exit 1
          env:
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongodb-username
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongodb-password
      containers:
        - name: {{ include "backend.fullname" . }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          image: "{{ .Values.global.registry | default "ghcr.io" }}/{{.Values.global.repository}}/backend:{{ .Values.global.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ default "Always" .Values.backend.imagePullPolicy }}
          env:
            - name: TTLS_API_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.ttlsSecretName | default "nrts-prc-api-secrets" }}
                  key: ttls-api-endpoint
            - name: WEBADE_AUTH_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.ttlsSecretName | default "nrts-prc-api-secrets" }}
                  key: webade-auth-endpoint
            - name: WEBADE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.ttlsSecretName | default "nrts-prc-api-secrets" }}
                  key: webade-username
            - name: WEBADE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.ttlsPasswordSecretName | default "ttls-api-test" }}
                  key: apikey
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongodb-username
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongodb-password
            - name: MONGODB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongodb-database
            - name: LOG_LEVEL
              value: info
            - name: MONGODB_SERVICE_HOST
              value: "{{ .Values.mongodb.service.name | default "mongodb" }}"
            - name: KEYCLOAK_ENABLED
              value: "true"
            - name: SSO_ISSUER
              valueFrom:
                secretKeyRef:
                  name: keycloak-sso
                  key: SSO_ISSUER
            - name: SSO_JWKSURI
              valueFrom:
                secretKeyRef:
                  name: keycloak-sso
                  key: SSO_JWKSURI
            - name: JWT_SIGN_EXPIRY
              valueFrom:
                secretKeyRef:
                  name: keycloak-sso
                  key: JWT_SIGN_EXPIRY
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-sso
                  key: SECRET
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources: # this is optional
            requests:
              cpu: 50m
              memory: 200Mi
            limits:
              cpu: 4
              memory: 8Gi
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - {{ include "backend.fullname" . }}
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - {{ .Release.Name }}
              topologyKey: "kubernetes.io/hostname"

{{- end }}
