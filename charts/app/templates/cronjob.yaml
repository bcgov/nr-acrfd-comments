{{- if .Values.cronjob.enabled }}
{{- $apiSecret := .Values.cronjob.updateShapes.secretName | default "nrts-prc-api-secrets" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "fullname" . }}-update-shapes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels" . | nindent 4 }}
    app.kubernetes.io/component: cronjob
spec:
  schedule: {{ .Values.cronjob.updateShapes.schedule | quote }}
  startingDeadlineSeconds: 999
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "labels" . | nindent 12 }}
            app.kubernetes.io/component: cronjob
        spec:
          serviceAccountName: {{ include "fullname" . }}-cronjob
          securityContext:
            runAsNonRoot: true
          containers:
            - name: update-shapes
              image: "{{ .Values.global.registry | default "ghcr.io" }}/{{.Values.global.repository}}/backend:{{ .Values.global.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ default "Always" .Values.backend.imagePullPolicy }}
              command:
                - node
                - /app/seed/shapesMigration/updateShapes.js
              # Parameters for updateShapes script:
              # <username> <password> <protocol> <host> <port> <client_id> <grant_type> <auth_endpoint>
              # followed by the optional <time_count> <time_metric> pair. The script rejects
              # exactly 9 arguments, so these two are all-or-nothing.
              args:
                - "$(API_USERNAME)"
                - "$(API_PASSWORD)"
                - "$(API_PROTOCOL)"
                - "$(API_HOST)"
                - "$(API_PORT)"
                - "$(CLIENT_ID)"
                - "$(GRANT_TYPE)"
                - "$(AUTH_ENDPOINT)"
                {{- with .Values.cronjob.updateShapes.timeCount }}
                - {{ . | quote }}
                - {{ $.Values.cronjob.updateShapes.timeMetric | required "cronjob.updateShapes.timeMetric is required when timeCount is set" | quote }}
                {{- end }}
              # NOTE: envFrom is deliberately not used here. The keys in {{ $apiSecret }} are
              # kebab-case (api-username, ...), which are not valid environment variable names,
              # so kubelet silently skips every one of them. On top of that, $(VAR) substitution
              # in `args` only resolves names declared in this `env` list -- envFrom values are
              # never expanded in command/args. Both reasons require explicit secretKeyRef
              # entries, which also let us map the kebab-case key onto the name the script wants.
              env:
                - name: LOG_LEVEL
                  value: info
                {{- range $name, $key := dict
                    "API_USERNAME" "api-username"
                    "API_PASSWORD" "api-password"
                    "CLIENT_ID" "client-id"
                    "GRANT_TYPE" "grant-type"
                    "AUTH_ENDPOINT" "auth-endpoint" }}
                - name: {{ $name }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $apiSecret }}
                      key: {{ $key }}
                {{- end }}
                # Where to reach the ACRFD API. Deliberately NOT read from the secret: its
                # api-host/api-protocol/api-port keys point at a route that no longer exists.
                # Defaults target the backend service directly, so the job stays in-cluster.
                - name: API_PROTOCOL
                  value: {{ .Values.cronjob.updateShapes.apiProtocol | default "http" | quote }}
                - name: API_HOST
                  value: {{ .Values.cronjob.updateShapes.apiHost | default (include "backend.fullname" .) | quote }}
                - name: API_PORT
                  value: {{ .Values.cronjob.updateShapes.apiPort | default .Values.backend.service.port | quote }}
                # Tantalis/WebADE config, using the same secrets as the backend deployment.
                # Without these ttlsUtils silently falls back to the t1api TEST instance.
                {{- range $name, $key := dict
                    "TTLS_API_ENDPOINT" "ttls-api-endpoint"
                    "WEBADE_AUTH_ENDPOINT" "webade-auth-endpoint"
                    "WEBADE_USERNAME" "webade-username" }}
                - name: {{ $name }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.backend.ttlsSecretName | default "nrts-prc-api-secrets" }}
                      key: {{ $key }}
                {{- end }}
                - name: WEBADE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backend.ttlsPasswordSecretName | default "ttls-api-test" }}
                      key: apikey
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
          restartPolicy: OnFailure
{{- end }}
---
{{- if .Values.cronjob.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fullname" . }}-cronjob
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels" . | nindent 4 }}
{{- end }}
