{{- if .Values.cronjob.enabled }}
{{- $apiSecret := .Values.cronjob.updateShapes.secretName | default "nrts-prc-api-secrets" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "fullname" . }}-update-shapes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels" . | nindent 4 }}
    app.kubernetes.io/component: cronjob
spec:
  schedule: {{ .Values.cronjob.updateShapes.schedule | quote }}
  startingDeadlineSeconds: 999
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "labels" . | nindent 12 }}
            app.kubernetes.io/component: cronjob
        spec:
          serviceAccountName: {{ include "fullname" . }}-cronjob
          securityContext:
            runAsNonRoot: true
          containers:
            - name: update-shapes
              image: "{{ .Values.global.registry | default "ghcr.io" }}/{{.Values.global.repository}}/backend:{{ .Values.global.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ default "Always" .Values.backend.imagePullPolicy }}
              command:
                - node
                - /app/seed/shapesMigration/updateShapes.js
              # Parameters for updateShapes script:
              # <username> <password> <protocol> <host> <port> <client_id> <grant_type> <auth_endpoint>
              args:
                - "$(API_USERNAME)"
                - "$(API_PASSWORD)"
                - "$(API_PROTOCOL)"
                - "$(API_HOST)"
                - "$(API_PORT)"
                - "$(CLIENT_ID)"
                - "$(GRANT_TYPE)"
                - "$(AUTH_ENDPOINT)"
              envFrom:
                - secretRef:
                    name: mongodb-secret
                - secretRef:
                    name: {{ $apiSecret }}
              # NOTE: $(VAR) substitution in `args` above only resolves names declared
              # in this `env` list. Variables supplied by `envFrom` reach the process
              # environment but are NOT expanded in command/args, so every argument the
              # script takes must be declared explicitly here.
              env:
                - name: LOG_LEVEL
                  value: info
                {{- range $key := list "API_USERNAME" "API_PASSWORD" "API_PROTOCOL" "API_HOST" "API_PORT" "CLIENT_ID" "GRANT_TYPE" "AUTH_ENDPOINT" }}
                - name: {{ $key }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $apiSecret }}
                      key: {{ $key }}
                {{- end }}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
          restartPolicy: OnFailure
{{- end }}
---
{{- if .Values.cronjob.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fullname" . }}-cronjob
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels" . | nindent 4 }}
{{- end }}
