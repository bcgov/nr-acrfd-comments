{{- if .Values.mongodb.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mongodb.fullname" . }}-migrate-fcv
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "mongodb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: default
      initContainers:
        - name: wait-for-mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for MongoDB to be ready at {{ .Values.mongodb.service.name | default "mongodb" }}:{{ .Values.mongodb.service.port | default 27017 }}..."
              for i in $(seq 1 60); do
                if mongo {{ .Values.mongodb.service.name | default "mongodb" }}:{{ .Values.mongodb.service.port | default 27017 }}/admin -u "$MONGODB_USER" -p "$MONGODB_PASSWORD" --eval "db.adminCommand('ping')" 2>/dev/null | grep -q 'ok'; then
                  echo "✅ MongoDB is ready"
                  exit 0
                fi
                echo "Attempt $i: MongoDB not ready yet, retrying..."
                sleep 5
              done
              echo "❌ MongoDB failed to become ready after 5 minutes"
              exit 1
          env:
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.secret.name }}
                  key: mongodb-username
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.secret.name }}
                  key: mongodb-password
      containers:
        - name: mongodb-migrate
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              # MongoDB is already confirmed reachable by init container
              echo "Connecting to MongoDB and checking Feature Compatibility Version..."
              
              # Get current FCV
              CURRENT_FCV=$(mongo {{ .Values.mongodb.service.name | default "mongodb" }}:27017/admin -u "$MONGODB_USER" -p "$MONGODB_PASSWORD" --eval "JSON.stringify(db.adminCommand('getParameter', {getParameter: 'featureCompatibilityVersion'}))" 2>/dev/null | grep -oP '"version":"?\K[^"]+' | head -1 || echo "unknown")
              echo "Current FCV: $CURRENT_FCV"
              echo "Target FCV: {{ .Values.mongodb.migration.targetFCV }}"

              # Run FCV upgrade if needed
              if [ "$CURRENT_FCV" != "{{ .Values.mongodb.migration.targetFCV }}" ]; then
                echo "Upgrading Feature Compatibility Version to {{ .Values.mongodb.migration.targetFCV }}..."
                mongo {{ .Values.mongodb.service.name | default "mongodb" }}:27017/admin -u "$MONGODB_USER" -p "$MONGODB_PASSWORD" << 'EOF'
              db.adminCommand({ setFeatureCompatibilityVersion: "{{ .Values.mongodb.migration.targetFCV }}" })
              EOF
                
                if [ $? -eq 0 ]; then
                  echo "✅ FCV upgrade successful"
                else
                  echo "❌ FCV upgrade failed"
                  exit 1
                fi
              else
                echo "ℹ️  FCV is already at target version, skipping upgrade"
              fi

              # Validate the upgrade
              echo "Validating migration..."
              mongo {{ .Values.mongodb.service.name | default "mongodb" }}:27017/admin -u "$MONGODB_USER" -p "$MONGODB_PASSWORD" << 'EOF'
              var status = db.adminCommand('serverStatus');
              print("✅ Server Status: OK");
              print("Database Name: " + db.getName());
              var appStatus = db.getSiblingDB("prc-prod").stats();
              print("✅ Application Database: OK");
              print("Collections: " + appStatus.collections);
              print("Documents: " + appStatus.objects);
              exit(0);
              EOF

              echo "✅ Migration completed successfully"
          env:
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.secret.name }}
                  key: mongodb-username
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.secret.name }}
                  key: mongodb-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
{{- end }}
